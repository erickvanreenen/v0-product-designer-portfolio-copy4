:root { --ground:#006654; --main:#81BF99; --white:#FFFFFF; --accent:#EFDCCE; --sub:#D1E4E0; --tagline:#E0EDEA; --water:#31886E; --soft:#278169; }
html, body { margin:0; }
html.framed, html.framed body { overflow:hidden; background:transparent; }
html.framed .ftn { height:100vh; max-height:none; aspect-ratio:auto; } /* embedded: fill the iframe, the page sets its size */
.ftn { position:relative; width:100%; height:clamp(320px, 30vw, 480px); overflow:hidden; background:var(--ground); color:var(--white); font-family:"FtN Open Sans", "Open Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
@media (max-width:767px) { .ftn { height:auto; aspect-ratio:4 / 5; max-height:560px; } }
.ftn-stage { position:absolute; left:0; top:0; transform-origin:0 0; overflow:visible; }
.ftn-sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* Scenes */
.scn { position:absolute; inset:0; overflow:visible; visibility:hidden; }
.scn.on { visibility:visible; }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:30px; }
.words > * { margin:0; }
.w { display:inline-block; }
.line { font-family:"FtN Montserrat", "Montserrat", system-ui, sans-serif; font-size:110px; line-height:1.08; font-weight:700; letter-spacing:-.02em; }
.sub { font-family:"FtN Montserrat", "Montserrat", system-ui, sans-serif; font-size:50px; line-height:1.35; font-weight:400; color:var(--sub); }
.brand { align-items:center; text-align:center; gap:46px; }
.mark { font-size:150px; font-weight:400; letter-spacing:-.005em; white-space:nowrap; }
.tagline { font-family:"FtN Montserrat", "Montserrat", system-ui, sans-serif; font-size:84px; color:var(--tagline); white-space:nowrap; }
.dash { width:220px; height:10px; border-radius:5px; background:var(--accent); transform-origin:50% 50%; }

/* Phone */
.pw { position:absolute; width:600px; height:1300px; transform-origin:0 0; }
.phone { position:absolute; left:0; top:0; width:600px; height:1300px; border-radius:90px; background:#363241; padding:22px; box-sizing:border-box; box-shadow:0 50px 110px rgba(0,0,0,.28); }
.screen { position:relative; width:100%; height:100%; border-radius:70px; overflow:hidden; background:#fff; }
.screen img { position:absolute; left:0; top:0; width:100%; display:block; transform-origin:50% 0; }
.cv { position:absolute; left:0; top:0; width:540px; height:1220px; transform:scale(1.0296296); transform-origin:0 0; overflow:hidden; }
.layer { position:absolute; left:0; top:0; width:540px; height:1220px; overflow:hidden; background:#fff; box-shadow:-10px 0 24px rgba(0,0,0,.14); }
.win { position:absolute; left:0; width:540px; overflow:hidden; }
.drawer { position:absolute; left:0; top:0; width:455px; height:1220px; overflow:hidden; transform:translateX(-100%); box-shadow:10px 0 24px rgba(0,0,0,.14); }
.dim { position:absolute; inset:0; background:rgba(0,0,0,.25); opacity:0; }
.hl { position:absolute; border:4px solid #006654; border-radius:10px; box-sizing:border-box; opacity:0; pointer-events:none; }
.tap { position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%; background:rgba(129,191,153,.55); border:3px solid rgba(255,255,255,.85); box-shadow:0 0 0 2px rgba(39,75,73,.45); box-sizing:border-box; opacity:0; pointer-events:none; }

/* Fern */
.fern { overflow:visible; width:100%; height:100%; }
.fern path { fill:none; stroke:var(--white); stroke-width:7.5; stroke-linejoin:round; stroke-linecap:round; transform-box:fill-box; }
.fern .lt { transform-origin:50% 100%; } .fern .ll { transform-origin:100% 100%; } .fern .lr { transform-origin:0% 100%; }
.fern.water path { stroke:var(--water); stroke-width:9; }
.fbox { position:absolute; }

/* Value tags: styled like the app's value chips */
.tag { position:absolute; padding:17px 36px; border-radius:40px; font-size:42px; font-weight:400; white-space:nowrap; background:#ECEDEF; color:#2B4441; box-shadow:0 18px 40px rgba(0,0,0,.18); }

/* Basket */
.ring { position:absolute; border-radius:50%; border:8px solid #274B49; box-sizing:border-box; }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.ink { fill:none; stroke:var(--white); stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
.soft { fill:var(--soft); } .sand { fill:var(--accent); }

/* Stacked (4:5) layout */
.is-tall .words { gap:18px; align-items:center; text-align:center; }
.is-tall .line { font-size:64px; line-height:1.1; letter-spacing:-.015em; }
.is-tall .sub { font-size:36px; line-height:1.35; }
.is-tall .brand { gap:26px; }
.is-tall .mark { font-size:84px; }
.is-tall .tagline { font-size:40px; }
.is-tall .dash { width:110px; height:6px; border-radius:3px; }
.is-tall .tag { padding:13px 27px; border-radius:30px; font-size:32px; box-shadow:0 9px 20px rgba(0,0,0,.18); }
.is-tall .ring { border-width:6px; }

/* Pause / play (WCAG 2.2.2) */
.ftn-toggle { position:absolute; right:12px; bottom:12px; width:40px; height:40px; border-radius:50%; border:0; padding:0; cursor:pointer; background:rgba(0,0,0,.32); color:#fff; display:grid; place-items:center; opacity:.75; transition:opacity .2s; }
.ftn-toggle:hover, .ftn-toggle:focus-visible { opacity:1; }
.ftn-toggle:focus-visible { outline:3px solid #fff; outline-offset:2px; }
.ftn-toggle svg { width:16px; height:16px; fill:currentColor; }
</style>
</head>
